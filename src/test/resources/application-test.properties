spring.application.name=ms-order

# MongoDB Testcontainers (será sobrescrito dinamicamente)
spring.data.mongodb.uri=mongodb://localhost:27017/order-test-db

# AWS SQS - Desabilitado para testes
spring.cloud.aws.sqs.enabled=false
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test

# SQS Queues
spring.sqs.queues.order-queue=order-queue
spring.sqs.queues.order-callback-queue=order-callback-queue

# Server
server.port=0

# Desabilitar auto-configuração do SQS
spring.autoconfigure.exclude=io.awspring.cloud.autoconfigure.messaging.SqsAutoConfiguration

# Logging
logging.level.com.nextime.order=DEBUG
logging.level.org.springframework.web=DEBUG
